name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: Installed CLI smoke test
        run: |
          cd /tmp
          /tmp/clean/bin/careo --version
          /tmp/clean/bin/careo validate --config "$GITHUB_WORKSPACE/examples/bulk-pricing/careo.yaml"
          set +e
          PATH=/tmp/clean/bin:$PATH careo compare --config "$GITHUB_WORKSPACE/examples/bulk-pricing/careo.yaml" --output-dir /tmp/out
          code=$?
          set -e
          test "$code" -eq 1
          grep -q '"conclusion": "DIFFERENCES_FOUND"' /tmp/out/report.json
          /tmp/clean/bin/careo replay --report /tmp/out/report.json
      - name: Installed CLI stateful smoke test
        run: |
          cd /tmp
          /tmp/clean/bin/careo scenario validate --spec "$GITHUB_WORKSPACE/examples/booking-api/careo-scenarios.yaml"
          set +e
          PATH=/tmp/clean/bin:$PATH careo scenario run --spec "$GITHUB_WORKSPACE/examples/booking-api/careo-scenarios.yaml" --output-dir /tmp/sc
          code=$?
          set -e
          test "$code" -eq 1
          grep -q '"outcome": "DIFFERENCE_CONFIRMED"' /tmp/sc/scenario-report.json
          PATH=/tmp/clean/bin:$PATH careo scenario replay --scenario /tmp/sc/regression.json

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Benchmark validation (quick budgets)
        run: uv run careo bench --suite benchmarks/booking/suite.yaml --quick --output-dir /tmp/bench
      - name: Committed benchmark records are consistent
        run: uv run python benchmarks/check_results.py benchmarks/results/latest
