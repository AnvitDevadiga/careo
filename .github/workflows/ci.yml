name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: Installed CLI smoke test
        run: |
          cd /tmp
          /tmp/clean/bin/careo --version
          /tmp/clean/bin/careo validate --config "$GITHUB_WORKSPACE/examples/bulk-pricing/careo.yaml"
          set +e
          PATH=/tmp/clean/bin:$PATH careo compare --config "$GITHUB_WORKSPACE/examples/bulk-pricing/careo.yaml" --output-dir /tmp/out
          code=$?
          set -e
          test "$code" -eq 1
          grep -q '"conclusion": "DIFFERENCES_FOUND"' /tmp/out/report.json
          /tmp/clean/bin/careo replay --report /tmp/out/report.json
      - name: Installed CLI stateful smoke test
        run: |
          cd /tmp
          /tmp/clean/bin/careo scenario validate --spec "$GITHUB_WORKSPACE/examples/booking-api/careo-scenarios.yaml"
          set +e
          PATH=/tmp/clean/bin:$PATH careo scenario run --spec "$GITHUB_WORKSPACE/examples/booking-api/careo-scenarios.yaml" --output-dir /tmp/sc
          code=$?
          set -e
          test "$code" -eq 1
          grep -q '"outcome": "DIFFERENCE_CONFIRMED"' /tmp/sc/scenario-report.json
          PATH=/tmp/clean/bin:$PATH careo scenario replay --scenario /tmp/sc/regression.json

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # provenance check needs the benchmark's source commit
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Benchmark validation (quick budgets)
        run: uv run careo bench --suite benchmarks/booking/suite.yaml --quick --output-dir /tmp/bench
      - name: Committed benchmark records are consistent
        run: uv run python benchmarks/check_results.py benchmarks/results/latest
      - name: Website data is current and traces to the raw records
        run: uv run python scripts/build_site_data.py --check
      - name: Published demo evidence still reproduces
        run: uv run python scripts/capture_demo.py --verify

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Internal link check
        run: npm run check:links
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser QA (5 widths, themes, keyboard, axe, demo, downloads)
        run: npm run e2e
