[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "careo"
version = "1.0.0"
description = "Differential and stateful behavior testing for original vs. rewritten programs and services. Catch what the AI rewrite broke."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anvit Devadiga" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "hypothesis>=6.100"]
keywords = ["differential testing", "property-based testing", "regression", "hypothesis", "rewrite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://anvitdevadiga.github.io/careo/"
Repository = "https://github.com/AnvitDevadiga/careo"
Documentation = "https://github.com/AnvitDevadiga/careo/tree/main/docs"

[project.scripts]
careo = "careo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/careo"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/benchmarks/booking", "/benchmarks/*.py",
    "/benchmarks/README.md", "/benchmarks/results", "/docs", "/assets", "/scripts",
    "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml",
]
exclude = ["/site", "**/node_modules", "**/__pycache__", "/benchmarks/results/*/runs"]

[tool.ruff]
line-length = 100
extend-exclude = ["site"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]
"benchmarks/**" = ["S"]
"scripts/make_wordmark.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/careo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
