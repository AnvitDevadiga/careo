[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "careo"
version = "0.1.0"
description = "Differential and stateful behavior testing for original vs. rewritten programs and services. Catch what the AI rewrite broke."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anvit Devadiga" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "hypothesis>=6.100"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/AnvitDevadiga/careo"

[project.scripts]
careo = "careo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/careo"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]
"benchmarks/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/careo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
